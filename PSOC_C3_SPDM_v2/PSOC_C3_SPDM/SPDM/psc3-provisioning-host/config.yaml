# Provisioning Host configuration (see docs/design_and_implementation.md).
# CLI flags override any value set here.

device:
  hwid: null   # KitProg3-XXXXXXXX / MiniProg4-XXXXXXXX
  i2c_address: 0x08     # valid DFU I2C range 0x08-0x78 (Must match with the Provisioning device App setting)
  i2c_speed: 400        # kHz

paths:
  work_dir: ./_work       # generated .mtbdfu files and captured response blobs

tools:
  dfuh_cli: 'C:\Users\kpato\ModusToolbox\tools_3.9\dfuh-tool\dfuh-cli.exe'   # path or command name of the DFU Host Tool CLI

protocol:
  checksum_type: 0      # 0 = 2's-complement summation (default), 1 = CRC-16/CCITT (see Packet formats)
                        # MUST match the device's CY_DFU_OPT_PACKET_CRC build setting
  product_id: "01020304"  # Enter-DFU Product Id (see Packet formats)
  file_version: "0x1"
  max_packet_payload: 128 # bytes (DEFAULT_MAX_TRANSFER_SIZE 135 - 7 overhead)
